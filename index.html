<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI 态势">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>AI 态势</title>
<style>
:root{
  --bg:#0b0e14; --bg2:#11151d; --bg3:#171c26; --line:#232a36;
  --fg:#e6edf3; --fg2:#8b98a9; --fg3:#5c6878;
  --acc:#4c8dff; --up:#3fb950; --down:#f85149; --warn:#d29922;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(58px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── header ── */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(11,14,20,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.hd{display:flex;align-items:baseline;gap:8px;padding-right:48px}
.hd h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.3px}
.hd .clock{margin-left:auto;font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
.sum{margin-top:5px;font-size:12px;color:var(--fg2);display:flex;flex-wrap:wrap;gap:0 10px;align-items:center;min-height:17px}
.sum .dot{color:var(--fg3)}
.sum .err{color:var(--warn)}
.refresh{position:absolute;right:14px;top:calc(9px + env(safe-area-inset-top));
  font-size:12.5px;color:var(--acc);padding:2px 0;white-space:nowrap;line-height:1.4}
.refresh:active{opacity:.6}

main{max-width:680px;margin:0 auto;padding:10px 12px 20px}
.view{display:none}
.view.active{display:block}

/* ── feed ── */
.card{
  display:block;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;margin-bottom:8px;
}
.card:active{background:var(--bg3)}
.card .top{display:flex;align-items:baseline;gap:8px}
.card .ico{font-size:14px;flex:none}
.card .ttl{font-weight:600;font-size:14.5px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .time{font-size:11.5px;color:var(--fg3);flex:none;font-variant-numeric:tabular-nums}
.card .meta{margin-top:4px;font-size:12.5px;color:var(--fg2);line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .tag{display:inline-block;font-size:10.5px;color:var(--fg3);border:1px solid var(--line);
  border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.card.hl{background:linear-gradient(180deg,#141c2b,#11151d);border-color:#26344a}
.card.hl .meta{-webkit-line-clamp:5}
.pill{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:20px;margin-left:6px;vertical-align:1px}
.pill.up{background:rgba(248,81,73,.15);color:var(--down)}
.pill.down{background:rgba(63,185,80,.15);color:var(--up)}
.pill.new{background:rgba(76,141,255,.16);color:var(--acc)}
.empty{text-align:center;color:var(--fg3);font-size:13px;padding:40px 0}
.skel{height:66px;border-radius:var(--r);margin-bottom:8px;
  background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 37%,var(--bg2) 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ── models ── */
.mbar{position:sticky;top:var(--hdrH,60px);z-index:15;background:var(--bg);
  padding:8px 0 6px;margin:-10px -12px 0;padding-left:12px;padding-right:12px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--fg);font-size:14px;min-width:0}
.search input::placeholder{color:var(--fg3)}
.search .clr{color:var(--fg3);font-size:16px;line-height:1;padding:0 2px;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;padding:5px 10px;border-radius:16px;border:1px solid var(--line);
  color:var(--fg2);background:var(--bg2);white-space:nowrap}
.chip.on{background:rgba(76,141,255,.14);border-color:#2f4f86;color:#9dc0ff}
.chip .n{color:var(--fg3);font-size:11px;margin-left:3px}
.chip.on .n{color:#7ba6ea}
.note{font-size:11px;color:var(--fg3);padding:2px 0 6px}
.mrow{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.mrank{flex:none;width:24px;text-align:right;font-size:13px;color:var(--fg3);
  font-variant-numeric:tabular-nums;padding-top:1px}
.mrank.top{color:var(--acc);font-weight:650}
.mbody{flex:1;min-width:0}
.mname{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mprov{font-size:12px;color:var(--fg2);margin-top:1px}
.mstat{font-size:12.5px;color:var(--fg2);margin-top:4px;font-variant-numeric:tabular-nums}
.mstat b{color:var(--fg);font-weight:600}
.mfoot{font-size:12px;color:var(--fg3);margin-top:3px;font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.mfoot .ar{color:#c9a227}
.more{width:100%;text-align:center;color:var(--acc);font-size:13px;padding:14px 0}

/* ── tabbar ── */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:rgba(11,14,20,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{flex:1;padding:8px 0 7px;text-align:center;color:var(--fg3);font-size:11px;line-height:1.25}
.tabbar button .ti{display:block;font-size:18px;line-height:1.1;margin-bottom:1px;filter:grayscale(1) opacity(.6)}
.tabbar button.on{color:var(--acc)}
.tabbar button.on .ti{filter:none}
</style>
</head>
<body>

<header>
  <div class="hd">
    <h1>AI 态势</h1>
    <span class="clock" id="clock"></span>
  </div>
  <div class="sum" id="sum"></div>
  <button class="refresh" id="btnRefresh">刷新</button>
</header>

<main>
  <section class="view active" id="view-feed"></section>
  <section class="view" id="view-models"></section>
</main>

<nav class="tabbar">
  <button class="on" data-tab="feed"><span class="ti">📡</span>态势</button>
  <button data-tab="models"><span class="ti">🏆</span>模型列表</button>
</nav>

<script>
'use strict';
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

/* ══════════ 数据源 ══════════ */
const CDN = {
  value : 'https://cdn.jsdelivr.net/gh/yyh-001/llm-value-rankings@main/data/models.json',
  arena : 'https://cdn.jsdelivr.net/gh/oolong-tea-2026/arena-ai-leaderboards@main/data',
  ar    : 'https://duanyytop.github.io/agents-radar',
};
const API = {
  openrouter : 'https://openrouter.ai/api/v1/models',
  hn         : 'https://hn.algolia.com/api/v1/search',
  gh         : 'https://api.github.com/search/repositories',
};

const mem = new Map();
function fetchJSON(url, ms = 20000){
  if (mem.has(url)) return mem.get(url);
  const p = (async () => {
    const ac = new AbortController();
    const t  = setTimeout(() => ac.abort(), ms);
    try {
      const r = await fetch(url, { signal: ac.signal, headers: { 'Accept': 'application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  })();
  mem.set(url, p);
  p.catch(() => mem.delete(url));
  return p;
}
function fetchText(url, ms = 20000){
  if (mem.has(url)) return mem.get(url);
  const p = (async () => {
    const ac = new AbortController();
    const t  = setTimeout(() => ac.abort(), ms);
    try {
      const r = await fetch(url, { signal: ac.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.text();
    } finally { clearTimeout(t); }
  })();
  mem.set(url, p);
  p.catch(() => mem.delete(url));
  return p;
}
/* localStorage 缓存（只给小响应体用） */
function lsGet(k){ try { return JSON.parse(localStorage.getItem('ar:' + k)); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem('ar:' + k, JSON.stringify(v)); } catch {} }

/* ══════════ 工具 ══════════ */
function fmtTime(ts){
  if (!ts) return '';
  const d = Date.now() - ts;
  if (d < 0)          return '刚刚';
  if (d < 6e4)        return '刚刚';
  if (d < 36e5)       return Math.floor(d/6e4) + ' 分钟前';
  if (d < 864e5)      return Math.floor(d/36e5) + ' 小时前';
  const day = Math.floor(d/864e5);
  if (day < 30)       return day + ' 天前';
  const dt = new Date(ts);
  return (dt.getMonth()+1) + '/' + dt.getDate();
}
function clockStr(){
  const d = new Date();
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' +
         String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function priceM(v){                       // $/token → $/M 字符串
  const n = parseFloat(v) * 1e6;
  if (!isFinite(n)) return '—';
  if (n === 0) return '0';
  if (n < 0.01) return n.toFixed(4);
  if (n < 1)    return n.toFixed(3);
  if (n < 100)  return n.toFixed(2);
  return n.toFixed(0);
}
function fmtCtx(n){
  if (!n) return '—';
  if (n >= 1e6) return (n/1e6).toFixed(n % 1e6 ? 2 : 0) + 'M';
  if (n >= 1e3) return Math.round(n/1e3) + 'K';
  return String(n);
}
function fmtNum(n){
  if (n == null || !isFinite(n)) return '—';
  if (n >= 1000) return (n/1000).toFixed(n >= 1e4 ? 0 : 1) + 'k';
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}
function vendorOf(id){ return String(id || '').split('/')[0]; }
function shiftDate(s, n){
  const d = new Date(s + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}
/* 模型名归一化：两榜命名差异（前缀 / 括号 / 后缀 / 标点） */
function normName(s){
  let x = String(s || '').toLowerCase();
  x = x.replace(/\(.*?\)/g, ' ');
  x = x.replace(/^[a-z0-9_.\-]+\//, '');
  x = x.replace(/^[a-z0-9_.\-]+:\s*/, '');
  x = x.replace(/[._\u00b7]/g, '-').replace(/\s+/g, '-');
  x = x.replace(/-+/g, '-').replace(/^-|-$/g, '');
  return x.replace(/-(high|max|medium|low|thinking|contributor|xhigh)$/, '');
}

/* ══════════ 态势 feed ══════════ */
const HN_QUERIES = ['AI', 'LLM', 'GPT'];

async function feedModels(){
  const d = await fetchJSON(API.openrouter);
  const list = (d.data || []).filter(m => m.created);
  const now = Date.now() / 1000;
  const fresh = list.filter(m => now - m.created < 21 * 86400);
  return fresh.sort((a,b) => b.created - a.created).slice(0, 8).map(m => ({
    type : 'model',
    icon : '🆕',
    tag  : '新模型',
    title: m.name || m.id,
    meta : `${esc(vendorOf(m.id))} · ${fmtCtx(m.context_length)} 上下文 · $${priceM(m.pricing && m.pricing.prompt)} / $${priceM(m.pricing && m.pricing.completion)} per M`,
    ts   : m.created * 1000,
    url  : 'https://openrouter.ai/' + m.id,
  }));
}

async function feedPrice(){
  const d = await fetchJSON(API.openrouter);
  const prev = lsGet('price') || {};
  const cur = {};
  const out = [];
  for (const m of (d.data || [])){
    const v = parseFloat(m.pricing && m.pricing.prompt) * 1e6;
    if (!isFinite(v) || v <= 0) continue;
    cur[m.id] = v;
    const old = prev[m.id];
    if (old > 0){
      const pct = (v - old) / old * 100;
      if (Math.abs(pct) >= 5 && Math.abs(pct) < 900){
        out.push({
          type : 'price',
          icon : '💰',
          tag  : '价格',
          title: `${m.name || m.id} ${pct < 0 ? '降价' : '涨价'} ${Math.abs(pct).toFixed(0)}%`,
          meta : `$${priceM(old/1e6)} → $${priceM(m.pricing.prompt)} per M（输入）`,
          ts   : Date.now(),
          url  : 'https://openrouter.ai/' + m.id,
          pill : pct < 0 ? { cls:'down', txt:'↓ ' + Math.abs(pct).toFixed(0) + '%' }
                         : { cls:'up',   txt:'↑ ' + pct.toFixed(0) + '%' },
        });
      }
    }
  }
  if (Object.keys(prev).length) lsSet('price', cur); else lsSet('price', cur);
  return out.sort((a,b) => Math.abs(parseFloat(b.pill.txt.replace(/[^\d.]/g,''))) -
                           Math.abs(parseFloat(a.pill.txt.replace(/[^\d.]/g,'')))).slice(0, 6);
}

async function feedHN(){
  const since = Math.floor(Date.now()/1000) - 3 * 86400;
  const rs = await Promise.allSettled(HN_QUERIES.map(q =>
    fetchJSON(`${API.hn}?query=${encodeURIComponent(q)}&tags=story&hitsPerPage=25` +
              `&numericFilters=created_at_i>${since},points>80`)));
  const seen = new Set(), hits = [];
  for (const r of rs){
    if (r.status !== 'fulfilled') continue;
    for (const h of (r.value.hits || [])){
      if (seen.has(h.objectID) || !h.title) continue;
      seen.add(h.objectID);
      hits.push(h);
    }
  }
  return hits.sort((a,b) => b.points - a.points).slice(0, 12).map(h => ({
    type : 'hn',
    icon : '🔥',
    tag  : '热帖',
    title: h.title,
    meta : `HN · ${h.points} 分 · ${h.num_comments || 0} 评论`,
    ts   : new Date(h.created_at).getTime(),
    url  : h.url || `https://news.ycombinator.com/item?id=${h.objectID}`,
  }));
}

async function feedGitHub(){
  const since = new Date(Date.now() - 10 * 864e5).toISOString().slice(0,10);
  const d = await fetchJSON(`${API.gh}?q=${encodeURIComponent(`created:>${since} stars:>300`)}` +
                            `&sort=stars&order=desc&per_page=20`);
  if (!d.items) throw new Error(d.message || 'gh rate limit');
  return d.items.slice(0, 10).map(r => ({
    type : 'gh',
    icon : '⭐',
    tag  : '开源',
    title: `${r.name}  +${fmtNum(r.stargazers_count)}★`,
    meta : `${r.language || '—'} · ${(r.description || '').slice(0, 90)}`,
    ts   : new Date(r.created_at).getTime(),
    url  : r.html_url,
  }));
}

/* agents-radar 日报：拿 arXiv / Product Hunt 等无 CORS 源的聚合结果 */
async function arDigest(name){
  const man = await fetchJSON(CDN.ar + '/manifest.json');
  const dates = (man.dates || []).slice(0, 4);
  for (const d of dates){
    try {
      const md = await fetchText(`${CDN.ar}/digests/${d.date}/${name}.md`);
      return { date: d.date, md };
    } catch {}
  }
  throw new Error('digest ' + name);
}
/* 兼容两种表：arXiv 三列（标题/作者/摘要）、PH 四列（产品/票数/评论/摘要） */
function parseRows(md){
  const out = [];
  const re = /^\|\s*\[([^\]]+)\]\((https?:[^)\s]+)[^|]*\|([^|]*)\|([^|]*)(?:\|([^|]*))?\|/gm;
  let m;
  while ((m = re.exec(md))){
    out.push({
      title: m[1].trim(), url: m[2].trim(),
      c1: (m[3] || '').trim(), c2: (m[4] || '').trim(), c3: (m[5] || '').trim(),
    });
  }
  return out;
}
function highlightOf(md){
  const m = md.match(/###\s*\*\*今日亮点\*\*\s*\n+([\s\S]*?)\n+\s*---/);
  return m ? m[1].replace(/\s+/g,' ').trim() : '';
}

async function feedArxiv(){
  const { date, md } = await arDigest('ai-arxiv');
  const rows = parseRows(md).slice(0, 4);
  const ts = new Date(date + 'T08:00:00Z').getTime();
  const items = rows.map(r => ({
    type : 'paper',
    icon : '📄',
    tag  : '论文',
    title: r.title,
    meta : `${r.c1} · ${r.c2}`.slice(0, 130),
    ts, url: r.url,
  }));
  const hl = highlightOf(md);
  if (hl){
    items.unshift({
      type : 'digest',
      icon : '📌',
      tag  : '今日要点',
      title: `ArXiv 研究日报 ${date}`,
      meta : hl,
      ts   : ts + 1000,
      url  : 'https://duanyytop.github.io/agents-radar/#date/' + date,
      hl   : true,
    });
  }
  return items;
}

async function feedPH(){
  const { date, md } = await arDigest('ai-ph');
  const ts = new Date(date + 'T08:00:00Z').getTime();
  return parseRows(md).slice(0, 6).map(r => ({
    type : 'ph',
    icon : '🚀',
    tag  : '产品',
    title: r.title,
    meta : r.c1 ? `${r.c1} 票 · ${r.c2} 评论` : (r.c2 || '').slice(0, 110),
    ts, url: r.url,
  }));
}

const FEED_SOURCES = [
  { key:'model', label:'新模型', fn: feedModels },
  { key:'price', label:'价格',   fn: feedPrice  },
  { key:'hn',    label:'热帖',   fn: feedHN     },
  { key:'gh',    label:'开源',   fn: feedGitHub },
  { key:'ph',    label:'产品',   fn: feedPH     },
  { key:'paper', label:'论文',   fn: feedArxiv  },
];

let feedState = { items: [], ok: 0, total: FEED_SOURCES.length, at: 0, failed: [] };

function renderFeed(){
  const el = $('#view-feed');
  if (!feedState.items.length){
    el.innerHTML = '<div class="empty">正在拉取…</div>';
    return;
  }
  const counts = {};
  for (const it of feedState.items) counts[it.tag] = (counts[it.tag] || 0) + 1;

  const sumEl = $('#sum');
  const order = ['新模型','价格','热帖','开源','产品','论文'];
  const parts = order.filter(k => counts[k]).map(k => `${k} ${counts[k]}`);
  const health = feedState.ok === feedState.total
    ? `<span class="dot">·</span>${feedState.ok}/${feedState.total} 源正常`
    : `<span class="dot">·</span><span class="err">${feedState.ok}/${feedState.total} 源正常</span>`;
  sumEl.innerHTML = esc(parts.join(' · ')) + health;
  const rb = $('#btnRefresh');
  if (rb) rb.onclick = loadFeed;

  el.innerHTML = feedState.items.map(it => `
    <a class="card${it.hl ? ' hl' : ''}" href="${esc(it.url)}" target="_blank" rel="noopener">
      <div class="top">
        <span class="ico">${it.icon}</span>
        <span class="ttl">${esc(it.title)}${it.pill ? `<span class="pill ${it.pill.cls}">${esc(it.pill.txt)}</span>` : ''}</span>
        <span class="time">${fmtTime(it.ts)}</span>
      </div>
      <div class="meta"><span class="tag">${esc(it.tag)}</span>${esc(it.meta)}</div>
    </a>`).join('');
}

async function loadFeed(){
  $('#view-feed').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  $('#sum').innerHTML = '正在拉取…';
  const rs = await Promise.allSettled(FEED_SOURCES.map(s => s.fn()));
  const items = [], failed = [];
  let ok = 0;
  rs.forEach((r, i) => {
    if (r.status === 'fulfilled'){ ok++; items.push(...r.value); }
    else failed.push(FEED_SOURCES[i].label);
  });
  items.sort((a,b) => (b.ts || 0) - (a.ts || 0));
  feedState = { items, ok, total: FEED_SOURCES.length, at: Date.now(), failed };
  renderFeed();
  if (failed.length) console.warn('源失败:', failed);
}

/* ══════════ 模型列表 ══════════ */
const ARENA_LBS = [
  { key:'text',     label:'文本' },
  { key:'code',     label:'代码' },
  { key:'vision',   label:'视觉' },
  { key:'document', label:'文档' },
  { key:'agent',    label:'Agent' },
];
const SORTS = [
  { key:'intelligence', label:'智能分', dir:-1, get:m => m.intelligence_score },
  { key:'value',        label:'价值分', dir:-1, get:m => m.value_score },
  { key:'price',        label:'价格',   dir: 1, get:m => m.pricing && m.pricing.blended },
  { key:'speed',        label:'速度',   dir:-1, get:m => m.speed },
  { key:'ctx',          label:'上下文', dir:-1, get:m => m.context_length },
  { key:'new',          label:'最新',   dir:-1, get:m => m.created },
  ...ARENA_LBS.map(lb => ({
    key:'arena:' + lb.key, label:'Arena ' + lb.label, dir:-1, arena: lb.key,
    get: m => m.__arena && m.__arena[lb.key],
  })),
];

let MODELS = null;
let SORT  = 'intelligence';
let QUERY = '';
let SHOWN = 60;
const ARENA_CACHE = {};

async function loadArena(lb){
  if (ARENA_CACHE[lb]) return ARENA_CACHE[lb];
  const man = await fetchJSON(`${CDN.arena}/latest.json`);
  let date = man.date;
  for (let i = 0; i < 4; i++){
    try {
      const r = await fetch(`${CDN.arena}/${date}/${lb}.json`, { cache:'force-cache' });
      if (r.ok){
        const j = await r.json();
        ARENA_CACHE[lb] = j;
        return j;
      }
    } catch {}
    date = shiftDate(date, -1);
  }
  throw new Error('arena ' + lb);
}

async function loadModels(){
  if (MODELS) return MODELS;
  const d = await fetchJSON(CDN.value, 30000);
  MODELS = (d.models || []).map(m => {
    m.__n = normName(m.name);
    m.__n2 = normName(m.id);
    return m;
  });
  MODELS.__meta = { updated_at: d.updated_at, total: d.total_models, ranked: d.ranked_models };
  return MODELS;
}

async function attachArena(lb){
  if (!lb) return;
  const [list, arena] = await Promise.all([loadModels(), loadArena(lb)]);
  const map = new Map();
  for (const a of (arena.models || [])) map.set(normName(a.model), a);
  for (const m of list){
    m.__arena = m.__arena || {};
    const hit = map.get(m.__n) || map.get(m.__n2);
    if (hit) m.__arena[lb] = hit.score;
  }
}

function sortMeta(key){
  return SORTS.find(s => s.key === key) || SORTS[0];
}
function coverage(key){
  if (!MODELS) return 0;
  const g = sortMeta(key).get;
  return MODELS.reduce((n, m) => n + (isFinite(g(m)) ? 1 : 0), 0);
}
function compare(a, b, key, dir){
  const g = sortMeta(key).get;
  const va = g(a), vb = g(b);
  const na = !isFinite(va), nb = !isFinite(vb);
  if (na && nb) return 0;
  if (na) return 1;                     // 缺值永远沉底
  if (nb) return -1;
  return (va - vb) * dir;
}

function renderModels(){
  const el = $('#view-models');
  if (!MODELS){
    el.innerHTML = '<div class="empty">正在拉取模型数据…</div>';
    return;
  }
  const q = QUERY.trim().toLowerCase();
  let list = MODELS;
  if (q){
    list = MODELS.filter(m =>
      m.name.toLowerCase().includes(q) ||
      m.id.toLowerCase().includes(q) ||
      (m.provider_display || '').toLowerCase().includes(q) ||
      (m.provider || '').toLowerCase().includes(q));
  }
  const meta = sortMeta(SORT);
  list = [...list].sort((a,b) => compare(a, b, SORT, meta.dir));

  const chips = SORTS.map(s => {
    const n = coverage(s.key);
    return `<button class="chip${s.key === SORT ? ' on' : ''}" data-sort="${s.key}">${s.label}<span class="n">${n || '—'}</span></button>`;
  }).join('');

  const head = `
    <div class="mbar">
      <div class="search">
        <span style="color:var(--fg3)">🔍</span>
        <input id="q" type="search" placeholder="搜索模型或厂商" value="${esc(QUERY)}" autocomplete="off">
        <button class="clr" id="qclr" style="${QUERY ? 'display:block' : ''}">✕</button>
      </div>
      <div class="chips">${chips}</div>
      <div class="note">共 ${MODELS.length} 个模型 · ${q ? '命中 ' + list.length + ' 个 · ' : ''}按 ${meta.label} ${meta.dir < 0 ? '降序' : '升序'} · 数据 ${(MODELS.__meta.updated_at || '').slice(0,10)}</div>
    </div>`;

  const rows = list.slice(0, SHOWN).map((m, i) => {
    const arena = m.__arena && m.__arena[sortMeta(SORT).arena];
    const arenaAll = ARENA_LBS.map(lb => m.__arena && m.__arena[lb.key] != null
      ? `<span class="ar">Arena ${lb.label} ${m.__arena[lb.key]}</span>` : '').join('');
    const badge = m.rank_new && m.rank ? '<span class="pill new">🆕</span>' : '';
    const chg = m.rank_change != null && m.rank_change !== 0
      ? `<span class="pill ${m.rank_change > 0 ? 'down' : 'up'}">${m.rank_change > 0 ? '▲' : '▼'}${Math.abs(m.rank_change)}</span>` : '';
    const price = m.pricing && isFinite(m.pricing.blended)
      ? `$${Number(m.pricing.blended).toFixed(m.pricing.blended < 0.1 ? 4 : 2)}/M` : '—';
    const spd = isFinite(m.speed) ? Number(m.speed).toFixed(1) : '—';
    const intel = isFinite(m.intelligence_score) ? m.intelligence_score : '—';
    const vs = isFinite(m.value_score) ? Number(m.value_score).toFixed(1) : '—';
    return `
      <div class="mrow">
        <div class="mrank${i < 3 ? ' top' : ''}">${i + 1}</div>
        <div class="mbody">
          <div class="mname">${esc(m.name)}${badge}${chg}</div>
          <div class="mprov">${esc(m.provider_display || m.provider || '')}</div>
          <div class="mstat"><b>${intel}</b> 智能 · <b>${spd}</b> t/s · ${fmtCtx(m.context_length)} 上下文</div>
          <div class="mfoot"><span>${price}</span><span>价值分 ${vs}</span>${arena ? `<span class="ar">Arena ${arena}</span>` : arenaAll ? arenaAll : ''}</div>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = head + (list.length
    ? rows + (list.length > SHOWN ? `<button class="more" id="more">显示更多（还有 ${list.length - SHOWN} 个）</button>` : '')
    : '<div class="empty">没有匹配的模型</div>');

  $('#q').oninput = e => {
    QUERY = e.target.value;
    SHOWN = 60;
    const pos = e.target.selectionStart;
    renderModels();
    const nq = $('#q'); nq.focus(); nq.setSelectionRange(pos, pos);
  };
  const clr = $('#qclr');
  if (clr) clr.onclick = () => { QUERY = ''; SHOWN = 60; renderModels(); };
  $$('.chip', el).forEach(c => c.onclick = async () => {
    SORT = c.dataset.sort;
    SHOWN = 60;
    const lb = sortMeta(SORT).arena;
    if (lb && !ARENA_CACHE[lb]){
      renderModels();
      try { await attachArena(lb); } catch (e) { console.warn(e); }
    }
    renderModels();
  });
  const more = $('#more');
  if (more) more.onclick = () => { SHOWN += 100; renderModels(); };
}

let modelsLoaded = false;
async function initModels(){
  if (modelsLoaded) return;
  renderModels();
  try {
    await loadModels();
    await attachArena('text').catch(() => {});
  } catch (e) {
    console.warn(e);
    $('#view-models').innerHTML = '<div class="empty">模型数据拉取失败，下拉重试</div>';
    return;
  }
  modelsLoaded = true;
  renderModels();
}

/* ══════════ Tab 切换 ══════════ */
function switchTab(tab, push){
  if (tab !== 'feed' && tab !== 'models') tab = 'feed';
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab));
  window.scrollTo(0, 0);
  if (push !== false){
    try { history.replaceState(null, '', tab === 'feed' ? location.pathname : '#' + tab); } catch {}
  }
  if (tab === 'models') initModels();
}
$$('.tabbar button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
window.addEventListener('hashchange', () => switchTab((location.hash || '').replace('#',''), false));

/* header 高度 → sticky 定位 */
function measureHeader(){
  document.documentElement.style.setProperty('--hdrH', $('header').offsetHeight + 'px');
}
window.addEventListener('resize', measureHeader);

/* ══════════ 启动 ══════════ */
$('#clock').textContent = clockStr();
measureHeader();
switchTab((location.hash || '').replace('#',''), false);
loadFeed();
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
